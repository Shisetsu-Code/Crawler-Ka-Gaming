name: Validate KA Gaming catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crawl_ka_gaming.py"
      - "requirements.txt"
      - "targets.txt"
      - "tests/**"
      - ".github/workflows/generate-targets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate live targets
        run: |
          python crawl_ka_gaming.py \
            --targets-only \
            --lang es \
            --min-games 1000 \
            --targets-path generated-targets.txt

      - name: Validate committed targets
        run: |
          wc -l generated-targets.txt targets.txt
          cmp generated-targets.txt targets.txt

      - name: Upload live targets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ka-gaming-targets
          path: generated-targets.txt
          if-no-files-found: error
          retention-days: 7
