name: Generate KA targets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-targets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live KA catalogue and generate targets
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import zlib
          from pathlib import Path

          url = "https://rmpdemo.kaga88.com/kaga/publicGameList?lang=en"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json, text/plain, */*",
                  "Referer": "https://www.kaga88.com/#games",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          assert payload.get("status") == "ok", payload.get("status")
          assert payload.get("statusCode") == 0, payload.get("statusCode")
          games = payload.get("games")
          assert isinstance(games, list)
          assert len(games) == int(payload.get("numGames"))
          assert len(games) >= 1000, len(games)

          base = str(payload["gameLaunchURL"]).rstrip("/") + "/?"
          targets = []
          seen = set()
          for game in games:
              gid = str(game["gameId"]).strip()
              assert gid and gid not in seen
              seen.add(gid)
              uid = (zlib.crc32(gid.encode("utf-8")) % 1_000_000_000) + 1
              query = urllib.parse.urlencode({
                  "g": gid,
                  "p": "demo",
                  "u": uid,
                  "t": 123,
                  "ak": "accessKey",
                  "cr": "USD",
                  "loc": "en",
                  "l": "https://www.kaga88.com/",
              })
              targets.append((gid.casefold(), base + query))

          targets.sort(key=lambda item: item[0])
          Path("targets.txt").write_text(
              "\n".join(url for _, url in targets) + "\n",
              encoding="utf-8",
          )
          print(f"Generated {len(targets)} live KA Gaming targets")
          PY
      - name: Commit generated targets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets.txt
          if git diff --cached --quiet; then
            echo "targets.txt unchanged"
          else
            git commit -m "Generate live KA Gaming targets"
            git push
          fi

# trigger live validation
